<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
     <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
</head>
<body>
   <div id="container">
    <div id="home" class="bg-cover bg-center max-w-screen min-h-screen  " style="background-image: url('./assets/Untitled\ design.jpg');">
      
        <!-- Home Section -->
         <div id="navbar" class="h-auto w-auto bg-orange-50 flex md:justify-between border-2 border-black border-double">
            <h1 id="portfolio"
                class="font-serif font-bold m-[5px] text-center text-[10px] decoration-solid md: font-serif font-bold m-[10px] text-center text-[30px] decoration-solid">
                Deep's Portfolio
            </h1>
          <div id="rightPart" class="justify-end md:justify-between flex flex-row w-[60vw]">
                <div id="details" class="hidden md:flex flex-row text-center justify-between items-center">
                    <a id="Home" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]" href="#HomeSection">Home</a>
                    <a id="About" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]">About</a>
                    <a id="Projects" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]">Projects</a>
                    <a id="Skills" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]">Skills</a>
                    <a id="Resume" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]">Resume</a>
                    <a id="Contact" class="m-2 font-semibold hover:[text-shadow:1px_1px_1px_gray]">Contact</a>
                </div>

                <div id="detailsBar" class="flex items-center text-2xl md:hidden">
                    ☰
                </div>
                <div id="contact" class="flex flex-row justify-end md:flex justify-between items-center">
                    <img id="linkdin" class="h-8 m-[5px] md: h-8 m-[10px]"
                        src="https://cdn-icons-png.flaticon.com/128/3536/3536569.png" alt="stylesheet" />
                    <img id="github" class="h-8 m-[5px] md: h-8 m-[10px]"
                        src="https://cdn-icons-png.flaticon.com/128/733/733609.png" alt="stylesheet" />
                </div>
                  
            </div> 
            
        </div>
        <h1 class="text-[8rem] text-center max-h-screen h-[100vh] items-center ">MY PORTFOLIO</h1>
    </div>
   </div>  
</body>
</html>

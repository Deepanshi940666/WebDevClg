<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h2></h2>
        <div id="Container"></div>
    </div>
    <script>
        let h2 = document.querySelector("h2")
        fetch("https://jsonplaceholder.typicode.com/todos").then((data) => {
            return data.json()
        }).then((val) => {
            console.log(val);
            val.forEach(items => {
                h2.innerHTML += items.title + "<br></br>";
            });

        }).catch(() => {
            console.log("error");

        })
        let img = document.querySelector("img")
        let container = document.getElementById("Container")
        fetch("https://jsonplaceholder.typicode.com/photos").then((data) => {
            return data.json()
        }).then((val) => {
            val.slice(0, 10).forEach((items) => {
                h2.innerHTML += items.title + "<br>";
            });
            console.log(val);
            val.forEach(items => {
                container.innerHTML += `<img src="${items.url}" width="100"><br>`;
            });

        }).catch(() => {
            console.log("error");

        })

    </script>
</body>

</html>
